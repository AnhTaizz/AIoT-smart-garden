# Legacy LAN user access: DEPRECATED FOR USER ACCESS.
# Retained for previous demos. New Internet demos use compose.device.yaml
# for ESP32 MQTT only, and Cloudflare Quick Tunnels for Web/API.
services:
  mosquitto:
    ports: !override
      - "0.0.0.0:${MQTT_PORT:-1883}:1883"

  frontend:
    ports: !override
      - "0.0.0.0:${FRONTEND_PORT:-5173}:80"

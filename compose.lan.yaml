# Local LAN demo override. Use only on a trusted Wi-Fi/hotspot.
# This is the phone path that may control the pump; tunnelled/Internet
# requests are read-only until the API has authentication (BC-02).
services:
  mosquitto:
    ports: !override
      - "0.0.0.0:${MQTT_PORT:-1883}:1883"

  frontend:
    ports: !override
      - "0.0.0.0:${FRONTEND_PORT:-5173}:80"
